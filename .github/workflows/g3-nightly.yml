name: G3 runtime nightly
'on':
  workflow_call:
    inputs:
      runtime_sha:
        required: true
        type: string
      agent_sha:
        required: true
        type: string
      app_sha:
        required: true
        type: string
      pinokio_sha:
        required: true
        type: string
      vibecomfy_sha:
        required: true
        type: string
    secrets:
      RUNTIME_READ_TOKEN:
        required: false
      ASTRID_READ_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-runtime-nightly-1
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Select Agent revision
      id: astrid-pin
      env:
        AGENT_OVERRIDE: ${{ inputs.agent_sha }}
      shell: bash
      run: "sha=\"${AGENT_OVERRIDE:-$(cat tests/astrid-agent.pin)}\"\nif [[ ! \"$sha\" =~ ^[0-9a-fA-F]{40}$ ]]; then\n  echo\
        \ \"Agent revision must be a full 40-character commit SHA\" >&2\n  exit 1\nfi\necho \"sha=$sha\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: ${{ inputs.agent_sha }}
        path: astrid-agent
        persist-credentials: false
    - name: Assert and record agent checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.agent_sha }}
        CHECKOUT_PATH: astrid-agent
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "agent" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Record effective checkouts
      shell: bash
      run: 'runtime_sha=$(git rev-parse HEAD)

        agent_sha=$(git -C "$ASTRID_CHECKOUT" rev-parse HEAD)

        echo "Runtime: $runtime_sha"

        echo "Agent: $agent_sha"

        printf ''Runtime: `%s`\nAgent: `%s`\n'' "$runtime_sha" "$agent_sha" >> "$GITHUB_STEP_SUMMARY"

        '
    - name: Install system media tools
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
    - run: python -m pip install -e '.[test]'
    - run: python -m pip install -e "$ASTRID_CHECKOUT"
    - run: python -m pytest -q -m integration
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-runtime-nightly-1.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
