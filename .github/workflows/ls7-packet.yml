name: LS7 packet proof
on:
  pull_request:
    branches: ["release/14/plan-55"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ls7-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: 19103ea6acbc030b3379e840ccc03491e47f1a0e
          path: ls2-agent
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packet test dependencies
        run: |
          python -m pip install -e '.[test]' -e ./packages/python
          sudo apt-get update && sudo apt-get install -y strace
      - name: Prove waits, resolution, replay and final progress
        run: >-
          python -m pytest -q tests/test_ls7_committed_changes.py
          tests/test_ls7_task_waits.py tests/test_ls7_thin_resolution.py tests/test_ls7_wait_client.py tests/test_ls7_rework.py
      - name: Preserve existing client projection, guarded reads and shutdown composition
        run: >-
          python -m pytest -q tests/test_client_parity.py tests/test_owner_identity_probes.py
          tests/test_runtime_http_maintenance.py
          tests/test_p2_commit_phase_capture.py::test_live_watchdog_uses_real_handler_and_private_faulthandler_output
          tests/test_p2_commit_phase_capture.py::test_watchdog_stop_is_truthful_before_a_new_daemon_capture
          tests/test_update_jobs.py::test_observed_job_leaves_the_contract_schema_digest_unchanged
      - name: Attribute native WAL and application syncs with the unchanged LS2 reader
        run: python tests/ls7_native_budget.py --output ls7-native-proof --agent-checkout ls2-agent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls7-runtime-proof-${{ github.sha }}
          path: ls7-native-proof
          retention-days: 14
  native-cleanup-comparison:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
        source: [base, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source == 'base' && '2537fed24385ec1c24f48a812e09af4bb63fb794' || '2f78ead473a4b39fc1bb5d0012b93be66861808d' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Record the exact checkout
        run: |
          mkdir -p cleanup-proof
          git rev-parse HEAD > cleanup-proof/commit.txt
          python --version > cleanup-proof/python.txt
          python -m pip freeze > cleanup-proof/dependencies.txt
          sw_vers > cleanup-proof/system.txt
          uname -m >> cleanup-proof/system.txt
      - name: Diagnose the unchanged native custody assertion
        run: >-
          python -m pytest -q --junitxml=cleanup-proof/results.xml
          tests/test_prepared_owner_authenticated_cleanup.py::test_authenticated_delayed_cleanup_ack_precedes_original_child_reap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls7-cleanup-${{ matrix.source }}-repeat-${{ matrix.repetition }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: cleanup-proof
          retention-days: 14
  watchdog-comparison:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
        source: [base, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source == 'base' && '2537fed24385ec1c24f48a812e09af4bb63fb794' || '0d0bdfe4bda0b94b79756e6ae0b7e7908a218c96' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - name: Record the exact watchdog checkout
        run: |
          mkdir -p watchdog-proof
          git rev-parse HEAD > watchdog-proof/commit.txt
          python --version > watchdog-proof/python.txt
          python -m pip freeze > watchdog-proof/dependencies.txt
          sw_vers > watchdog-proof/system.txt
          uname -m >> watchdog-proof/system.txt
      - name: Diagnose the unchanged watchdog sampling assertion
        run: >-
          python -m pytest -q --junitxml=watchdog-proof/results.xml
          tests/test_p2_commit_phase_capture.py::test_live_watchdog_uses_real_handler_and_private_faulthandler_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ls7-watchdog-${{ matrix.source }}-repeat-${{ matrix.repetition }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: watchdog-proof
          retention-days: 14
