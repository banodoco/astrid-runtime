name: G3 runtime ci
'on':
  workflow_call:
    inputs:
      runtime_sha:
        required: true
        type: string
      agent_sha:
        required: true
        type: string
      app_sha:
        required: true
        type: string
      pinokio_sha:
        required: true
        type: string
      vibecomfy_sha:
        required: true
        type: string
    secrets:
      RUNTIME_READ_TOKEN:
        required: false
      ASTRID_READ_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  windows-realm-publication:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-runtime-ci-5
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install -e '.[test]'
    - run: python -m pip install -e packages/python
    - name: Verify Windows update backup daemon from a selected venv
      run: python -m pytest -q -rP -m "" tests/test_windows_runtime_launch.py
    - name: Verify native realm creation, ownership, and rollback
      run: python -m pytest -q tests/test_realm_creation_publication.py tests/test_realm_replacement_publication.py tests/test_platform_windows.py::test_windows_directory_mutex_uses_global_user_scoped_identity
        tests/test_m1_review.py
    - name: Verify native Windows signal and foreground cleanup paths
      run: python -m pytest -q -m "" tests/test_platform_signaling.py tests/test_runtime_cli_serve_cleanup.py tests/test_service_stop.py
    - name: Verify Runtime service cleanup receipt contract
      run: python -m pytest -q tests/test_profile_services.py::test_supervisor_marks_runtime_owned_service_name_after_configured_env
        tests/test_profile_services.py::test_pack_host_cleanup_receipts_are_bounded_owner_only_and_preserved tests/test_profile_services.py::test_service_cleanup_receipt_history_keeps_latest_64_attempts
        tests/test_profile_services.py::test_pack_host_cleanup_receipt_refuses_corrupt_history_without_overwriting tests/test_profile_services.py::test_shutdown_retry_publishes_pack_host_cleanup_receipt
        tests/test_profile_services.py::test_cleanup_receipt_write_failure_retains_identity_and_stop_retries tests/test_profile_services.py::test_pending_cleanup_blocks_replacement_attempt
        tests/test_profile_services.py::test_cleanup_retry_preserves_on_failure_clean_exit_policy tests/test_profile_services.py::test_cleanup_retry_preserves_readiness_failure_outcome
        'tests/test_profile_services.py::test_invalid_declaration_is_refused[document18]' 'tests/test_profile_services.py::test_invalid_declaration_is_refused[document19]'
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-runtime-ci-5.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-runtime-ci-4
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install system media tools
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      shell: bash
    - name: Install system media tools (macOS)
      if: runner.os == 'macOS'
      run: brew install ffmpeg
    - run: python -m pip install -e '.[test]'
    - run: python -m pytest -q -n 2
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-runtime-ci-4.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
  darwin-native:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-runtime-ci-3
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: brew install ffmpeg
    - run: python -m pip install -e '.[test]'
    - run: python -m pytest -q -m darwin_native
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-runtime-ci-3.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
  typescript-client:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: npm ci
      working-directory: packages/typescript
    - run: npm test
      working-directory: packages/typescript
  boundary:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-runtime-ci-2
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: python -m pip install -e '.[test]'
    - run: python -m pytest -q tests/test_second_client_e2e.py -m ""
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-runtime-ci-2.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
  sandbox-process-control:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: .
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - run: sh tests/seccomp/run-suite.sh
  portability-lifecycle:
    env:
      ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
    defaults:
      run:
        working-directory: astrid-runtime
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
      with:
        path: astrid-runtime
        repository: banodoco/astrid-runtime
        ref: ${{ inputs.runtime_sha }}
        persist-credentials: false
    - name: Assert and record runtime checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.runtime_sha }}
        CHECKOUT_PATH: astrid-runtime
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "runtime" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Restore pip cache (C-08)
      id: c08-runtime-ci-1
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Select Agent revision
      id: astrid-pin
      env:
        AGENT_OVERRIDE: ${{ inputs.agent_sha }}
      shell: bash
      run: "sha=\"${AGENT_OVERRIDE:-$(cat tests/astrid-agent.pin)}\"\nif [[ ! \"$sha\" =~ ^[0-9a-fA-F]{40}$ ]]; then\n  echo\
        \ \"Agent revision must be a full 40-character commit SHA\" >&2\n  exit 1\nfi\necho \"sha=$sha\" >> \"$GITHUB_OUTPUT\"\
        \n"
    - uses: actions/checkout@v4
      with:
        repository: banodoco/astrid-agent
        ref: ${{ inputs.agent_sha }}
        path: astrid-agent
        persist-credentials: false
    - name: Assert and record agent checkout
      shell: bash
      env:
        EXPECTED: ${{ inputs.agent_sha }}
        CHECKOUT_PATH: astrid-agent
      run: 'set -euo pipefail

        [[ "$EXPECTED" =~ ^[0-9a-f]{40}$ ]]

        actual=$(git -C "$GITHUB_WORKSPACE/$CHECKOUT_PATH" rev-parse HEAD)

        printf "%s: %s\n" "agent" "$actual" | tee -a "$GITHUB_STEP_SUMMARY"

        [[ "$actual" == "$EXPECTED" ]]

        '
    - name: Record effective checkouts
      shell: bash
      run: 'runtime_sha=$(git rev-parse HEAD)

        agent_sha=$(git -C "$ASTRID_CHECKOUT" rev-parse HEAD)

        echo "Runtime: $runtime_sha"

        echo "Agent: $agent_sha"

        printf ''Runtime: `%s`\nAgent: `%s`\n'' "$runtime_sha" "$agent_sha" >> "$GITHUB_STEP_SUMMARY"

        '
    - run: python -m pip install -e '.[test]'
    - run: python -m pip install -e packages/python
    - run: python -m pip install -e "$ASTRID_CHECKOUT"
    - run: python -m pytest -q -m "" tests/test_platform.py tests/test_platform_signaling.py tests/test_platform_windows.py
        tests/test_windows_worker_handoff.py tests/test_platform_filesystem.py tests/test_dirfd_windows.py tests/test_windows_filesystem_native.py
        tests/test_runtime_upgrade.py tests/test_runtime_compact.py tests/test_relocation_plan.py tests/test_local_worker_placement.py::test_activation_acceptance_replay_flushes_record_with_writable_handle
        tests/test_profile_services.py tests/test_service_stop.py tests/test_m1_review.py tests/test_windows_runtime_sweep.py
        tests/test_foreground.py tests/test_native_custody.py tests/test_portable_lifecycle.py
    - name: Save pip cache on main or int branches (C-08)
      if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/')) && steps.c08-runtime-ci-1.outputs.cache-hit
        != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip'
          || '~/.cache/pip' }}
        key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
