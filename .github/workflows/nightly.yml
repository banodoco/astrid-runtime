name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: ["release/14/plan-39"]
  workflow_dispatch:
    inputs:
      agent_sha:
        description: Full immutable Agent commit SHA (empty uses fixture pin)
        required: false
        type: string

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pip cache (C-08)
        id: c08-runtime-nightly-1
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The override is an immutable test input; never modify the fixture pin.
      - name: Select Agent revision
        id: astrid-pin
        env:
          AGENT_OVERRIDE: ${{ inputs.agent_sha }}
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-03 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: |
          sha="${AGENT_OVERRIDE:-$(cat tests/astrid-agent.pin)}"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Agent revision must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.astrid-pin.outputs.sha }}
          path: astrid-agent
          fetch-depth: 0
      - name: Check historical Agent archive input
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-05 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        env:
          HISTORICAL_AGENT_SHA: 321cef4b8c89a4a938cb9ede41ba6a5444cf1b62
        run: |
          if git -C "$ASTRID_CHECKOUT" fetch --no-tags origin "$HISTORICAL_AGENT_SHA"; then
            if git -C "$ASTRID_CHECKOUT" cat-file -e "$HISTORICAL_AGENT_SHA^{commit}"; then
              echo "Agent archive commit available: $HISTORICAL_AGENT_SHA"
              printf 'Agent archive commit available: `%s`\n' "$HISTORICAL_AGENT_SHA" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Agent archive commit unavailable after fetch: $HISTORICAL_AGENT_SHA"
              printf 'Agent archive commit unavailable after fetch: `%s`\n' "$HISTORICAL_AGENT_SHA" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "::warning::Agent archive commit is not fetchable from the pinned public history: $HISTORICAL_AGENT_SHA"
            printf 'Agent archive commit not fetchable from the pinned public history: `%s`\n' "$HISTORICAL_AGENT_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Record effective checkouts
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-06 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        env:
          AGENT_SHA: ${{ steps.astrid-pin.outputs.sha }}
        run: |
          runtime_sha=$(git rev-parse HEAD)
          agent_sha=$(git -C "$ASTRID_CHECKOUT" rev-parse HEAD)
          test "$agent_sha" = "$AGENT_SHA"
          echo "Runtime: $runtime_sha"
          echo "Agent: $agent_sha"
          printf 'Runtime: `%s`\nAgent: `%s`\n' "$runtime_sha" "$agent_sha" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plan39 recorded command 08
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-08 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: npm ci
        working-directory: packages/typescript
      - name: Add locked TypeScript compiler to PATH
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-09 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: echo "$GITHUB_WORKSPACE/packages/typescript/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install system media tools
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-10 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Plan39 recorded command 11
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-11 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: python -m pip install -e '.[test]'
      - name: Plan39 recorded command 12
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-12 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: python -m pip install -e "$ASTRID_CHECKOUT"
      - name: Run nightly integration tests
        if: ${{ !cancelled() }}
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-13 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: python scripts/ci/run_pytest.py "$TEST_RESULTS_DIR" nightly-integration -- -q -m integration
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/test-results-nightly-all-${{ runner.os }}
      - name: Verify stored per-test results
        if: always()
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/test-results-nightly-all-${{ runner.os }}
        shell: python -I "${{ github.workspace }}/scripts/ci/ceiling_capture.py" --step step-14 --matrix ${{ strategy.job-index || 0 }} --shell bash {0}
        run: python scripts/ci/check_test_results.py "$TEST_RESULTS_DIR"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-nightly-integration-all-${{ runner.os }}
          path: ${{ runner.temp }}/test-results-nightly-all-${{ runner.os }}/*
          retention-days: 90
          if-no-files-found: warn
      - name: Save pip cache on main or int branches (C-08)
        if: ${{ always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/int/') || (startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/main'))) && steps.c08-runtime-nightly-1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.os == 'Windows' && '~/AppData/Local/pip/Cache' || runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip' }}"
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.11-${{ hashFiles('**/requirements.txt', 'pyproject.toml') }}
      - name: Retain actual Plan39 command and native result evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-ceiling-${{ github.job }}-${{ strategy.job-index || '0' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/failure-ceiling/${{ github.job }}/
          retention-days: 90
          if-no-files-found: error
