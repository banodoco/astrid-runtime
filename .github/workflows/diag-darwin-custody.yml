# TEMPORARY diagnostic. Never merge. Runs only the darwin custody-spawn test and keeps its artifacts.
name: diag-darwin-custody
on:
  push:
    branches: [diag/darwin-custody-spawn]
jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: brew install ffmpeg
      - run: python -m pip install -e '.[test]'
      - name: Checkout published Agent alongside Runtime
        shell: bash
        env:
          AGENT_SHA: 4866090edcce7df31d1f0e03cf2354b878e94105
        run: |
          agent_dir="$GITHUB_WORKSPACE/../astrid-agent"
          git init --quiet "$agent_dir"
          git -C "$agent_dir" remote add origin https://github.com/banodoco/astrid-agent
          git -C "$agent_dir" fetch --depth=1 origin "$AGENT_SHA"
          git -C "$agent_dir" checkout --detach --quiet FETCH_HEAD
          test "$(git -C "$agent_dir" rev-parse HEAD)" = "$AGENT_SHA"
      - name: Install the Agent's locked dependencies, then the Agent non-editably
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-input --require-hashes -r "$GITHUB_WORKSPACE/../astrid-agent/requirements/runtime.lock"
          python -m pip install --disable-pip-version-check --no-input --no-deps "$GITHUB_WORKSPACE/../astrid-agent"
      - name: Run only the custody-spawn test with a kept base temp
        run: python -m pytest -vv -rA -s -m darwin_native tests/test_installed_pack_custody_spawn.py --basetemp="$RUNNER_TEMP/diag-basetemp" -p no:xdist 2>&1 | tee "$RUNNER_TEMP/pytest-output.txt"
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-darwin-custody
          path: |
            ${{ runner.temp }}/pytest-output.txt
            ${{ runner.temp }}/diag-basetemp/**/runtime.log
            ${{ runner.temp }}/diag-basetemp/**/host-argv.jsonl
            ${{ runner.temp }}/diag-basetemp/**/start-response.json
            ${{ runner.temp }}/diag-basetemp/**/discovery.json
            ${{ runner.temp }}/diag-basetemp/**/boot-manifest.json
          if-no-files-found: warn
