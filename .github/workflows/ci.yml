# Default run per push (testing plan UR.5); the second-client boundary test as its own job.
name: CI

on:
  push:
    branches: [main, release-1, "int/**"]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      agent_sha:
        description: Full immutable Agent commit SHA (empty uses fixture pin)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: CI / Select affected paths
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      typescript: ${{ steps.paths.outputs.typescript }}
      appui: ${{ steps.paths.outputs.appui }}
    steps:
      - id: paths
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            // An absent output means run everything. Never trust a partial file list.
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const pr = await github.rest.pulls.get({owner, repo, pull_number});
            const count = pr.data.changed_files;
            if (!Number.isInteger(count) || count < 1 || count >= 3000) return;
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner, repo, pull_number, per_page: 100});
            if (files.length !== count || files.some(f =>
              !['added', 'modified'].includes(f.status) || typeof f.filename !== 'string')) return;
            const paths = files.map(f => f.filename);
            core.setOutput('docs', String(paths.every(p =>
              p === 'README.md' || /^docs\/.*\.md$/i.test(p))));
            core.setOutput('typescript', String(paths.every(p => p.startsWith('packages/typescript/'))));
            core.setOutput('appui', String(paths.every(p =>
              p.startsWith('src/features/') || p.startsWith('src/pages/'))));
  windows-realm-publication:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true' && needs.changes.outputs.typescript != 'true')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install -e packages/python
      - name: Verify Windows update backup daemon from a selected venv
        run: python -m pytest -q -rP -m "" tests/test_windows_runtime_launch.py
      - name: Verify native realm creation, ownership, and rollback
        run: >-
          python -m pytest -q
          tests/test_realm_creation_publication.py
          tests/test_realm_replacement_publication.py
          tests/test_platform_windows.py::test_windows_directory_mutex_uses_global_user_scoped_identity
          tests/test_m1_review.py
      - name: Verify native Windows signal and foreground cleanup paths
        run: >-
          python -m pytest -q -m ""
          tests/test_platform_signaling.py
          tests/test_runtime_cli_serve_cleanup.py
          tests/test_service_stop.py
      - name: Verify Runtime service cleanup receipt contract
        run: >-
          python -m pytest -q
          tests/test_profile_services.py::test_supervisor_marks_runtime_owned_service_name_after_configured_env
          tests/test_profile_services.py::test_pack_host_cleanup_receipts_are_bounded_owner_only_and_preserved
          tests/test_profile_services.py::test_service_cleanup_receipt_history_keeps_latest_64_attempts
          tests/test_profile_services.py::test_pack_host_cleanup_receipt_refuses_corrupt_history_without_overwriting
          tests/test_profile_services.py::test_shutdown_retry_publishes_pack_host_cleanup_receipt
          tests/test_profile_services.py::test_cleanup_receipt_write_failure_retains_identity_and_stop_retries
          tests/test_profile_services.py::test_pending_cleanup_blocks_replacement_attempt
          tests/test_profile_services.py::test_cleanup_retry_preserves_on_failure_clean_exit_policy
          tests/test_profile_services.py::test_cleanup_retry_preserves_readiness_failure_outcome
          'tests/test_profile_services.py::test_invalid_declaration_is_refused[document18]'
          'tests/test_profile_services.py::test_invalid_declaration_is_refused[document19]'

  unit:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system media tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        shell: bash
      - name: Install system media tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -n 2

  darwin-native:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true' && needs.changes.outputs.typescript != 'true')) }}
    # The darwin_native lane is deselected by default and skipped off macOS; this
    # is the job where it runs (tests/lanes.py SKIP_REGISTRY).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: brew install ffmpeg
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -m darwin_native

  typescript-client:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript

  boundary:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_second_client_e2e.py -m ""

  sandbox-process-control:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true' && needs.changes.outputs.typescript != 'true')) }}
    # Sandbox mode under a seccomp profile that denies what NVIDIA OpenShell's
    # does: pidfd_open (ENOSYS), pidfd_send_signal and process-group kill (EPERM).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/seccomp/run-suite.sh

  portability-lifecycle:
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || (needs.changes.outputs.docs != 'true' && needs.changes.outputs.typescript != 'true')) }}
    env:
      ASTRID_CHECKOUT: ${{ github.workspace }}/astrid-agent
    defaults:
      run:
        working-directory: astrid-runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrid-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # The override is an immutable test input; never modify the fixture pin.
      - name: Select Agent revision
        id: astrid-pin
        env:
          AGENT_OVERRIDE: ${{ inputs.agent_sha }}
        shell: bash
        run: |
          sha="${AGENT_OVERRIDE:-$(cat tests/astrid-agent.pin)}"
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Agent revision must be a full 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: banodoco/astrid-agent
          ref: ${{ steps.astrid-pin.outputs.sha }}
          path: astrid-agent
      - name: Record effective checkouts
        shell: bash
        run: |
          runtime_sha=$(git rev-parse HEAD)
          agent_sha=$(git -C "$ASTRID_CHECKOUT" rev-parse HEAD)
          echo "Runtime: $runtime_sha"
          echo "Agent: $agent_sha"
          printf 'Runtime: `%s`\nAgent: `%s`\n' "$runtime_sha" "$agent_sha" >> "$GITHUB_STEP_SUMMARY"
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install -e packages/python
      - run: python -m pip install -e "$ASTRID_CHECKOUT"
      - run: >-
          python -m pytest -q -m ""
          tests/test_platform.py
          tests/test_platform_signaling.py
          tests/test_platform_windows.py
          tests/test_windows_worker_handoff.py
          tests/test_platform_filesystem.py
          tests/test_dirfd_windows.py
          tests/test_windows_filesystem_native.py
          tests/test_runtime_upgrade.py
          tests/test_runtime_compact.py
          tests/test_relocation_plan.py
          tests/test_local_worker_placement.py::test_activation_acceptance_replay_flushes_record_with_writable_handle
          tests/test_profile_services.py
          tests/test_service_stop.py
          tests/test_m1_review.py
          tests/test_windows_runtime_sweep.py
          tests/test_foreground.py
          tests/test_native_custody.py
          tests/test_portable_lifecycle.py

  pr-gate:
    name: CI / PR aggregate
    if: ${{ always() }}
    needs: [changes, windows-realm-publication, unit, darwin-native, typescript-client, boundary, sandbox-process-control, portability-lifecycle]
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          needs = json.loads(os.environ['RESULTS'])
          outputs = needs['changes'].get('outputs', {})
          is_pr = os.environ['EVENT'] == 'pull_request'
          classes = {'windows-realm-publication': 'typescript', 'unit': '', 'darwin-native': 'typescript', 'typescript-client': '', 'boundary': '', 'sandbox-process-control': 'typescript', 'portability-lifecycle': 'typescript'}
          for job, special in classes.items():
              skipped = is_pr and (outputs.get('docs') == 'true' or
                                    (special and outputs.get(special) == 'true'))
              expected = 'skipped' if skipped else 'success'
              result = needs[job]['result']
              if result != expected:
                  raise SystemExit(f"{job}: expected {expected}, got {result}")
          PYCODE
