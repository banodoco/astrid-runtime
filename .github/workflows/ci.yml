name: Temporary Plan 38 Linux proof
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify dispatch ref and live PR 129 head before testing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = banodoco/astrid-runtime
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/proof/38-01-6c4bd28b
          test "$(gh api repos/banodoco/astrid-runtime/git/ref/heads/proof/38-01-6c4bd28b --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/banodoco/astrid-runtime/pulls/129 --jq .head.sha)" = 6c4bd28b4c034ed65d4e501f7b02d90bd082fb03
          test "$(gh api repos/banodoco/astrid-runtime/pulls/129 --jq .head.ref)" = p38/recovery-38-01-linux-authority
          test "$(gh api repos/banodoco/astrid-runtime/pulls/129 --jq .head.repo.full_name)" = "$GITHUB_REPOSITORY"
          workflow_path="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}"
          workflow_path="${workflow_path%@*}"
          test "$workflow_path" = .github/workflows/ci.yml
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" |
            jq -e --arg parent 6c4bd28b4c034ed65d4e501f7b02d90bd082fb03 --arg path "$workflow_path" \
            '(.parents|length)==1 and .parents[0].sha==$parent and (.files|length)==1 and .files[0].filename==$path and .files[0].status=="modified"'
      - uses: actions/checkout@v4
        with:
          ref: 6c4bd28b4c034ed65d4e501f7b02d90bd082fb03
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact source and native Linux capabilities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6c4bd28b4c034ed65d4e501f7b02d90bd082fb03
          test "$(cat tests/astrid-agent.pin)" = 0e1543e0da2215db9cb3320cfd1083174c3c62a9
          test "$(git rev-parse HEAD^{tree})" = e425ed203baf38e2c7f5a620f7f6dbe1c69fa703
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
          uname -a
          python - <<'PY'
          import os, signal, socket, struct, sys, tempfile
          assert sys.platform == 'linux'
          with tempfile.TemporaryDirectory() as d, socket.socket(socket.AF_UNIX) as listener:
              listener.bind(d + '/native')
              listener.listen(1)
              with socket.socket(socket.AF_UNIX) as client:
                  client.connect(d + '/native')
                  connection, _ = listener.accept()
                  connection.close()
          first, second = socket.socketpair()
          with first, second:
              raw = first.getsockopt(socket.SOL_SOCKET, getattr(socket,'SO_PEERPIDFD',77),4)
              fd = struct.unpack('i',raw)[0]
              try:
                  with open(f'/proc/self/fdinfo/{fd}') as f:
                      fields = dict(line.strip().split(':', 1) for line in f if ':' in line)
                  assert int(fields['Pid']) == os.getpid(), fields
                  signal.pidfd_send_signal(fd, 0)
              finally:
                  os.close(fd)
          fd = os.pidfd_open(os.getpid())
          try:
              signal.pidfd_send_signal(fd, 0)
          finally:
              os.close(fd)
          print('Native Unix listener and kernel peer pidfd available')
          PY
      - name: Install authoritative worker fixture
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv
          bash scripts/worker-env/runtime-setup.sh
          test "$(git -C "$GITHUB_WORKSPACE.env/agent" rev-parse HEAD)" = 0e1543e0da2215db9cb3320cfd1083174c3c62a9
          cat "$GITHUB_WORKSPACE.env/setup.txt"
      - name: Record exact checkout and installed fixture provenance
        shell: bash
        run: |
          set -euo pipefail
          E="$GITHUB_WORKSPACE.env"
          test "$(git rev-parse HEAD)" = 6c4bd28b4c034ed65d4e501f7b02d90bd082fb03
          test "$(git rev-parse HEAD^{tree})" = e425ed203baf38e2c7f5a620f7f6dbe1c69fa703
          test "$(cat tests/astrid-agent.pin)" = 0e1543e0da2215db9cb3320cfd1083174c3c62a9
          test "$(git -C "$E/agent" rev-parse HEAD)" = 0e1543e0da2215db9cb3320cfd1083174c3c62a9
          test -z "$(git status --porcelain)"
          test -z "$(git -C "$E/agent" status --porcelain)"
          git -C "$E/agent" rev-parse HEAD^{tree} > "$RUNNER_TEMP/38-01-agent-tree.txt"
          "$E/venv/bin/python" -I - <<'PY' | tee "$RUNNER_TEMP/38-01-provenance.txt"
          import importlib.metadata as md
          import importlib.util
          import json, os, sys, sysconfig
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          runtime = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          agent = Path(str(runtime) + '.env/agent').resolve()
          purelib = Path(sysconfig.get_path('purelib')).resolve()
          print('python', sys.version, sys.executable)
          for module, expected in (
              ('astrid_runtime', runtime / 'astrid_runtime/__init__.py'),
              ('runtime_protocol', runtime / 'runtime_protocol/__init__.py'),
              ('astrid_runtime_client', runtime / 'packages/python/astrid_runtime_client/__init__.py'),
              ('astrid', purelib / 'astrid/__init__.py'),
          ):
              spec = importlib.util.find_spec(module)
              assert spec is not None and spec.origin, module
              origin = Path(spec.origin).resolve()
              print(module, origin)
              assert origin == expected.resolve(), (module, origin, expected)
          dist = md.distribution('astrid')
          direct = json.loads(dist.read_text('direct_url.json'))
          url = urlparse(direct['url'])
          assert url.scheme == 'file' and Path(unquote(url.path)).resolve() == agent, direct
          assert not direct.get('dir_info', {}).get('editable', False), direct
          print('Agent distribution', dist.version, direct)
          print('pytest', md.version('pytest'))
          PY
      - name: Enumerate selected cases using identical markers
        shell: bash
        env:
          PYTEST_ADDOPTS: ''
        run: |
          set -euo pipefail
          bash scripts/worker-env/runtime-pytest.sh --collect-only -q \
            tests/test_custody_provider_dispatch.py tests/test_role_custody_authority.py \
            tests/test_process_binding_provider.py tests/test_linux_peer_authority.py \
            tests/test_linux_process_binding.py tests/test_custody_linux_deadlines.py \
            tests/test_zero_shim_boundary.py tests/test_local_worker_handoff.py \
            | tee "$RUNNER_TEMP/38-01-collected.txt"
      - name: Run exact eight-file proof
        shell: bash
        env:
          PYTEST_ADDOPTS: ''
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6c4bd28b4c034ed65d4e501f7b02d90bd082fb03
          test "$(git rev-parse HEAD^{tree})" = e425ed203baf38e2c7f5a620f7f6dbe1c69fa703
          test "$(cat tests/astrid-agent.pin)" = 0e1543e0da2215db9cb3320cfd1083174c3c62a9
          test "$(git -C "$GITHUB_WORKSPACE.env/agent" rev-parse HEAD)" = 0e1543e0da2215db9cb3320cfd1083174c3c62a9
          test -z "$(git status --porcelain)"
          test -z "$(git -C "$GITHUB_WORKSPACE.env/agent" status --porcelain)"
          set +e
          bash scripts/worker-env/runtime-pytest.sh -q -rA --junitxml="$RUNNER_TEMP/38-01.xml" \
            tests/test_custody_provider_dispatch.py tests/test_role_custody_authority.py tests/test_process_binding_provider.py tests/test_linux_peer_authority.py \
            tests/test_linux_process_binding.py tests/test_custody_linux_deadlines.py \
            tests/test_zero_shim_boundary.py tests/test_local_worker_handoff.py 2>&1 | tee "$RUNNER_TEMP/38-01-pytest.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" | tee "$RUNNER_TEMP/38-01-pytest-exit.txt"
          test "${statuses[1]}" -eq 0
          exit "${statuses[0]}"
      - name: Verify mandatory Linux cases and all executed outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PYCODE'
          from collections import Counter
          import hashlib, os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          temp = Path(os.environ['RUNNER_TEMP'])
          selected = [
              line.strip() for line in (temp / '38-01-collected.txt').read_text(encoding='utf-8').splitlines()
              if line.strip().startswith('tests/') and '::' in line
          ]
          expected_counts = {
              'tests/test_process_binding_provider.py': 24,
              'tests/test_linux_peer_authority.py': 24,
              'tests/test_linux_process_binding.py': 15,
              'tests/test_custody_linux_deadlines.py': 9,
              'tests/test_zero_shim_boundary.py': 7,
              'tests/test_local_worker_handoff.py': 5,
              'tests/test_custody_provider_dispatch.py': 21,
              'tests/test_role_custody_authority.py': 91,
          }
          assert len(selected) == len(set(selected)) == 196, (len(selected), len(set(selected)))
          assert Counter(n.split('::', 1)[0] for n in selected) == expected_counts
          digest = hashlib.sha256(('\n'.join(sorted(selected)) + '\n').encode('utf-8')).hexdigest()
          print('Selected-node inventory SHA256', digest)
          assert digest == '3e32321e0543cacf70a3caf1fe6e389c4afc515485db9152186e50e8c068c94c', 'selected inventory differs from PR129 exact-head receipt'

          def junit_key(node):
              address, bracket, params = node.partition('[')
              parts = address.split('::')
              module = parts[0].removesuffix('.py').replace('/', '.')
              return ('.'.join([module, *parts[1:-1]]), parts[-1] + bracket + params)

          native = (
              'tests/test_linux_peer_authority.py::test_child_originated_connection_matches_independently_retained_spawn',
              'tests/test_linux_peer_authority.py::test_child_originated_connection_rejects_expected_birth_mismatch_without_leak',
              'tests/test_linux_peer_authority.py::test_inherited_parent_socketpair_cannot_authenticate_child',
              'tests/test_linux_peer_authority.py::test_real_host_child_authenticates_original_runtime_parent',
              'tests/test_linux_process_binding.py::test_real_linux_broker_admits_wrapper_seals_binds_and_signals_child',
              'tests/test_linux_process_binding.py::test_real_broker_term_is_reaped_by_retained_process',
              'tests/test_linux_process_binding.py::test_non_child_same_user_connection_does_not_starve_the_real_child',
              'tests/test_linux_process_binding.py::test_registration_frame_pid_must_match_the_kernel_peer_pid',
              'tests/test_linux_process_binding.py::test_exited_peer_is_rejected_per_connection_and_the_real_child_still_seals',
          )
          portable = (
              'tests/test_custody_provider_dispatch.py::test_windows_broker_keeps_authority_after_channel_close_through_ready_and_signal',
              'tests/test_role_custody_authority.py::test_signal_holds_shared_guard_until_kernel_call_completes',
          )
          for node in native + portable:
              assert node in selected, f'mandatory node not selected: {node}'
          root = ET.parse(temp / '38-01.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else root.findall('./testsuite')
          assert suites, 'missing JUnit suites'
          cases = list(root.iter('testcase'))
          assert cases, 'no testcases executed'
          expected = Counter(junit_key(node) for node in selected)
          assert len(expected) == len(selected), 'ambiguous JUnit node normalization'
          executed = Counter((c.get('classname', ''), c.get('name', '')) for c in cases)
          bad = [
              (c.get('classname'), c.get('name'), [x for x in ('failure', 'error', 'skipped') if c.find(x) is not None])
              for c in cases if any(c.find(x) is not None for x in ('failure', 'error', 'skipped'))
          ]
          print('JUnit totals', len(cases), 'non-passing:', bad)
          print('Missing:', sorted((expected - executed).items()), 'Extra:', sorted((executed - expected).items()))
          assert executed == expected, 'collection/execution mismatch'
          assert not bad, 'non-passing or skipped JUnit case'
          assert sum(int(s.get('tests', '0')) for s in suites) == len(selected)
          assert all(int(s.get(k, '0')) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          assert (temp / '38-01-pytest-exit.txt').read_text().strip() == '0', 'pytest or session guard failed'
          print(f'All {len(cases)} executed nodes passed; nine native and two portable mandatory nodes present.')
          PYCODE
      - name: Recheck product tree and Agent fixture after test
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6c4bd28b4c034ed65d4e501f7b02d90bd082fb03
          test "$(git rev-parse HEAD^{tree})" = e425ed203baf38e2c7f5a620f7f6dbe1c69fa703
          test "$(cat tests/astrid-agent.pin)" = 0e1543e0da2215db9cb3320cfd1083174c3c62a9
          test "$(git -C "$GITHUB_WORKSPACE.env/agent" rev-parse HEAD)" = 0e1543e0da2215db9cb3320cfd1083174c3c62a9
          test "$(git -C "$GITHUB_WORKSPACE.env/agent" rev-parse HEAD^{tree})" = "$(cat "$RUNNER_TEMP/38-01-agent-tree.txt")"
          test -z "$(git status --porcelain)"
          test -z "$(git -C "$GITHUB_WORKSPACE.env/agent" status --porcelain)"
          git rev-parse HEAD HEAD^{tree}
          git -C "$GITHUB_WORKSPACE.env/agent" rev-parse HEAD HEAD^{tree}
      - name: Preserve individual results in the job log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for file in "$RUNNER_TEMP"/38-01*; do
            if test -f "$file"; then sha256sum "$file"; fi
          done
          test -s "$RUNNER_TEMP/38-01.xml"
          cat "$RUNNER_TEMP/38-01.xml"
      - name: Upload exact collection and individual JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plan38-pr129-6c4bd28b-evidence
          path: |
            ${{ runner.temp }}/38-01.xml
            ${{ runner.temp }}/38-01-collected.txt
            ${{ runner.temp }}/38-01-pytest.log
            ${{ runner.temp }}/38-01-pytest-exit.txt
            ${{ runner.temp }}/38-01-provenance.txt
            ${{ runner.temp }}/38-01-agent-tree.txt
          if-no-files-found: error
          retention-days: 14
      - name: Confirm proof still describes the live PR head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api repos/banodoco/astrid-runtime/pulls/129 --jq .head.sha)
          echo "PR 129 head at evidence collection: $current"
          test "$current" = 6c4bd28b4c034ed65d4e501f7b02d90bd082fb03
          test "$(gh api repos/banodoco/astrid-runtime/pulls/129 --jq .head.ref)" = p38/recovery-38-01-linux-authority
          test "$(gh api repos/banodoco/astrid-runtime/pulls/129 --jq .head.repo.full_name)" = "$GITHUB_REPOSITORY"
          test "$(gh api repos/banodoco/astrid-runtime/git/ref/heads/proof/38-01-6c4bd28b --jq .object.sha)" = "$GITHUB_SHA"
